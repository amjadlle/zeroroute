<title>ZeroRoute Console Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Fragment+Mono&display=swap">
<style>
/* PROTOTYPE (throwaway): four console design directions for ZeroRoute (issue #1 / spec #47).
   Layout concept: each direction owns its shell (sidebar, top nav, icon rail, floating dock) and its Home hierarchy;
   the other screens share markup but are skinned by that direction's tokens.
   Color: OKLCH. Neutrals carry a faint tint of the active accent hue (--ah). Red is reserved for "danger".
   Every token is written once with light-dark(); the viewer's theme or the switcher's theme picks the side. */
:root{
  color-scheme: light dark;
  --ah: 275; --ac: .17; --al: .52; --ad: .76;
  --font-ui: "Geist", system-ui, sans-serif; --font-display: var(--font-ui); --font-mono: "Geist Mono", ui-monospace, monospace;
  --nc: .008;
  --bg: light-dark(oklch(.985 var(--nc) var(--ah)), oklch(.165 var(--nc) var(--ah)));
  --surface: light-dark(oklch(1 0 0), oklch(.198 var(--nc) var(--ah)));
  --surface-2: light-dark(oklch(.965 var(--nc) var(--ah)), oklch(.232 var(--nc) var(--ah)));
  --sunken: light-dark(oklch(.975 var(--nc) var(--ah)), oklch(.145 var(--nc) var(--ah)));
  --border: light-dark(oklch(.912 var(--nc) var(--ah)), oklch(.28 var(--nc) var(--ah)));
  --border-strong: light-dark(oklch(.66 .01 var(--ah)), oklch(.53 .01 var(--ah)));
  --text: light-dark(oklch(.21 .012 var(--ah)), oklch(.965 .005 var(--ah)));
  --muted: light-dark(oklch(.45 .014 var(--ah)), oklch(.75 .01 var(--ah)));
  --subtle: light-dark(oklch(.535 .012 var(--ah)), oklch(.655 .01 var(--ah)));
  --accent: light-dark(oklch(var(--al) var(--ac) var(--ah)), oklch(var(--ad) var(--ac) var(--ah)));
  --accent-hover: light-dark(oklch(calc(var(--al) - .05) var(--ac) var(--ah)), oklch(calc(var(--ad) + .05) var(--ac) var(--ah)));
  --accent-fg: light-dark(oklch(.99 .005 var(--ah)), oklch(.19 .04 var(--ah)));
  --accent-soft: color-mix(in oklch, var(--accent) 13%, transparent);
  --ok: light-dark(oklch(.5 .13 152), oklch(.79 .15 152));
  --warn: light-dark(oklch(.52 .12 66), oklch(.83 .14 80));
  --bad: light-dark(oklch(.52 .19 27), oklch(.73 .17 25));
  --info: light-dark(oklch(.5 .13 240), oklch(.79 .12 240));
  --ok-soft: color-mix(in oklch, var(--ok) 14%, transparent);
  --warn-soft: color-mix(in oklch, var(--warn) 16%, transparent);
  --bad-soft: color-mix(in oklch, var(--bad) 14%, transparent);
  --info-soft: color-mix(in oklch, var(--info) 14%, transparent);
  --scrim: light-dark(oklch(.25 .02 var(--ah) / .35), oklch(.05 0 0 / .6));
  --r: 6px; --rc: 10px; --h: 32px; --fs: 14px;
  --card-bg: var(--surface); --card-border: 1px solid var(--border); --card-shadow: none;
  --pop-shadow: 0 18px 48px -12px oklch(.1 .02 var(--ah) / .35), 0 2px 6px oklch(.1 .02 var(--ah) / .12);
  /* Switcher is deliberately outside the design being judged: constant ink pill in both themes. */
  --sw-bg: oklch(.17 .01 260); --sw-fg: oklch(.97 0 0); --sw-mute: oklch(.72 .01 260); --sw-line: oklch(.32 .01 260);
}
:root[data-theme="light"]{ color-scheme: light }
:root[data-theme="dark"]{ color-scheme: dark }

/* ---------- Direction tokens ---------- */
:root[data-variant="graphite"]{
  --font-ui: "Geist", system-ui, sans-serif; --font-display: "Geist", system-ui, sans-serif; --font-mono: "Geist Mono", ui-monospace, monospace;
  --nc: .009; --r: 6px; --rc: 10px; --h: 32px; --fs: 13.5px;
}
:root[data-variant="daylight"]{
  --font-ui: "Plus Jakarta Sans", system-ui, sans-serif; --font-display: "Plus Jakarta Sans", system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --nc: .012; --r: 9px; --rc: 14px; --h: 38px; --fs: 14px;
  --bg: light-dark(oklch(.972 .012 var(--ah)), oklch(.175 .014 var(--ah)));
  --surface: light-dark(oklch(1 0 0), oklch(.215 .014 var(--ah)));
  --surface-2: light-dark(oklch(.958 .012 var(--ah)), oklch(.25 .014 var(--ah)));
  --border: light-dark(oklch(.915 .01 var(--ah)), oklch(.3 .014 var(--ah)));
  --card-border: 1px solid var(--border);
  --card-shadow: 0 1px 2px oklch(.2 .03 var(--ah) / .06), 0 8px 24px -12px oklch(.2 .04 var(--ah) / .14);
}
:root[data-variant="monolith"]{
  --font-ui: "Instrument Sans", system-ui, sans-serif; --font-display: "Instrument Sans", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --nc: 0; --r: 5px; --rc: 8px; --h: 34px; --fs: 14px;
  --bg: light-dark(oklch(1 0 0), oklch(.13 0 0));
  --surface: light-dark(oklch(1 0 0), oklch(.13 0 0));
  --surface-2: light-dark(oklch(.965 0 0), oklch(.2 0 0));
  --sunken: light-dark(oklch(.975 0 0), oklch(.17 0 0));
  --border: light-dark(oklch(.91 0 0), oklch(.275 0 0));
  --border-strong: light-dark(oklch(.64 0 0), oklch(.52 0 0));
  --text: light-dark(oklch(.16 0 0), oklch(.985 0 0));
  --muted: light-dark(oklch(.44 0 0), oklch(.76 0 0));
  --subtle: light-dark(oklch(.53 0 0), oklch(.66 0 0));
  --card-shadow: none;
}
:root[data-variant="harbor"]{
  --font-ui: "Figtree", system-ui, sans-serif; --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif; --font-mono: "Fragment Mono", ui-monospace, monospace;
  --nc: .02; --r: 999px; --rc: 22px; --h: 40px; --fs: 15px;
  --bg: light-dark(oklch(.965 .018 var(--ah)), oklch(.185 .022 var(--ah)));
  --surface: light-dark(oklch(.995 .004 var(--ah)), oklch(.235 .024 var(--ah)));
  --surface-2: light-dark(oklch(.935 .024 var(--ah)), oklch(.28 .026 var(--ah)));
  --sunken: light-dark(oklch(.95 .02 var(--ah)), oklch(.205 .022 var(--ah)));
  --border: light-dark(oklch(.9 .02 var(--ah)), oklch(.32 .024 var(--ah)));
  --text: light-dark(oklch(.24 .03 var(--ah)), oklch(.96 .01 var(--ah)));
  --muted: light-dark(oklch(.45 .03 var(--ah)), oklch(.77 .02 var(--ah)));
  --subtle: light-dark(oklch(.52 .03 var(--ah)), oklch(.68 .02 var(--ah)));
  --card-border: 1px solid transparent;
}

/* ---------- Base ---------- */
*,*::before,*::after{ box-sizing: border-box }
html,body{ height: 100% }
body{ background: var(--bg); color: var(--text); font: 400 var(--fs)/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button,input,select,textarea{ font: inherit; color: inherit }
a{ color: var(--accent) }
h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em }
p{ margin: 0 }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.ic{ width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none }
.ic.lg{ width: 20px; height: 20px }
.num,.table td,.kpi-v{ font-variant-numeric: tabular-nums }
.mono{ font-family: var(--font-mono); font-size: .92em }
.sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.muted{ color: var(--muted) } .subtle{ color: var(--subtle) }
.row{ display: flex; align-items: center; gap: 8px } .between{ justify-content: space-between } .wrap{ flex-wrap: wrap }
.stack{ display: grid; gap: 16px } .stack-sm{ display: grid; gap: 8px }
.spacer{ flex: 1 }
@media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important } }

/* ---------- Components ---------- */
.btn{ display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: var(--h); padding: 0 14px; border-radius: var(--r); border: 1px solid transparent; font-weight: 550; font-size: .95em; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, transform .1s }
.btn:active{ transform: translateY(1px) }
.btn[disabled]{ opacity: .55; cursor: not-allowed }
.btn.sm{ height: calc(var(--h) - 6px); padding: 0 10px; font-size: .88em }
.btn.pri{ background: var(--accent); color: var(--accent-fg) } .btn.pri:hover{ background: var(--accent-hover) }
.btn.sec{ background: var(--surface); border-color: var(--border); color: var(--text) } .btn.sec:hover{ background: var(--surface-2) }
.btn.ghost{ background: transparent; color: var(--muted) } .btn.ghost:hover{ background: var(--surface-2); color: var(--text) }
.btn.danger{ background: var(--bad); color: oklch(.99 0 0) } .btn.danger:hover{ filter: brightness(1.08) }
.btn.icon{ width: var(--h); padding: 0 }
.btn .spin{ width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite }
@keyframes spin{ to{ transform: rotate(360deg) } }
:root[data-variant="monolith"] .btn.pri{ background: var(--text); color: var(--bg) }
:root[data-variant="monolith"] .btn.pri:hover{ background: var(--muted) }
:root[data-variant="daylight"] .btn.pri{ box-shadow: 0 1px 0 oklch(1 0 0 / .18) inset, 0 1px 2px oklch(.2 .05 var(--ah) / .3) }
:root[data-variant="harbor"] .btn{ font-weight: 650; padding: 0 18px }

.card{ background: var(--card-bg); border: var(--card-border); border-radius: var(--rc); box-shadow: var(--card-shadow); min-width: 0 }
.card-b{ padding: 18px } .card-h{ display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border) }
.card-h h2{ font-size: 1em; font-weight: 600 } .card-h p{ color: var(--muted); font-size: .88em }
:root[data-variant="harbor"] .card-h{ border-bottom: 0; padding: 20px 22px 4px } :root[data-variant="harbor"] .card-b{ padding: 22px }
:root[data-variant="monolith"] .card-h h2{ font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }

.badge{ display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface-2); color: var(--muted) }
.badge.ok{ background: var(--ok-soft); color: var(--ok) } .badge.warn{ background: var(--warn-soft); color: var(--warn) }
.badge.bad{ background: var(--bad-soft); color: var(--bad) } .badge.info{ background: var(--info-soft); color: var(--info) }
.badge.acc{ background: var(--accent-soft); color: var(--accent) }
.dot{ width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none }
.dot.pulse{ box-shadow: 0 0 0 0 currentColor; animation: pulse 2s infinite }
@keyframes pulse{ 0%{ box-shadow: 0 0 0 0 color-mix(in oklch, currentColor 60%, transparent) } 70%{ box-shadow: 0 0 0 6px transparent } 100%{ box-shadow: 0 0 0 0 transparent } }
:root[data-variant="monolith"] .badge{ border-radius: 4px; background: transparent; border: 1px solid var(--border) }

.field{ display: grid; gap: 6px } .field label,.label{ font-weight: 550; font-size: .92em }
.hint{ color: var(--muted); font-size: 12.5px } .err{ color: var(--bad); font-size: 12.5px; display: flex; gap: 6px; align-items: center }
.input,.textarea,.select{ width: 100%; min-width: 0; height: var(--h); padding: 0 11px; border-radius: min(var(--r), 10px); border: 1px solid var(--border-strong); background: var(--sunken); color: var(--text); transition: border-color .15s, box-shadow .15s }
.textarea{ height: auto; min-height: 92px; padding: 9px 11px; resize: vertical; line-height: 1.5 }
.input::placeholder,.textarea::placeholder{ color: var(--subtle) }
.input:hover,.textarea:hover{ border-color: var(--muted) }
.input:focus,.textarea:focus,.select:focus{ outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.input[aria-invalid="true"]{ border-color: var(--bad) } .input[aria-invalid="true"]:focus{ box-shadow: 0 0 0 3px var(--bad-soft) }
:root[data-variant="harbor"] .input,:root[data-variant="harbor"] .select{ border-radius: 14px; padding: 0 14px; background: var(--surface); border-color: var(--border) }
:root[data-variant="harbor"] .textarea{ border-radius: 16px; background: var(--surface); border-color: var(--border) }
.input-wrap{ position: relative; display: flex } .input-wrap .input{ padding-right: 40px }
.input-wrap .btn{ position: absolute; right: 3px; top: 3px; height: calc(var(--h) - 6px); width: calc(var(--h) - 6px) }
.lead{ position: relative } .lead .ic{ position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--subtle) } .lead .input{ padding-left: 34px }

.switch{ position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--border-strong); border: 0; cursor: pointer; flex: none; transition: background .15s; padding: 0 }
.switch::after{ content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: oklch(.99 0 0); box-shadow: 0 1px 2px oklch(0 0 0 / .3); transition: transform .18s }
.switch[aria-checked="true"]{ background: var(--accent) } .switch[aria-checked="true"]::after{ transform: translateX(16px) }

.seg{ display: inline-flex; padding: 3px; gap: 2px; border-radius: calc(min(var(--r), 10px) + 3px); background: var(--surface-2); border: 1px solid var(--border) }
.seg button{ height: calc(var(--h) - 8px); padding: 0 12px; border: 0; border-radius: min(var(--r), 10px); background: transparent; color: var(--muted); font-weight: 550; font-size: .9em; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{ background: var(--surface); color: var(--text); box-shadow: 0 1px 2px oklch(.2 .02 var(--ah) / .14), 0 0 0 1px var(--border) }
:root[data-variant="harbor"] .seg{ border-radius: 999px; border: 0 } :root[data-variant="harbor"] .seg button{ border-radius: 999px }

.tabs{ display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto }
.tabs button{ position: relative; height: 38px; padding: 0 12px; border: 0; background: none; color: var(--muted); font-weight: 550; cursor: pointer; white-space: nowrap }
.tabs button[aria-selected="true"]{ color: var(--text) }
.tabs button[aria-selected="true"]::after{ content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent) }

.table-wrap{ overflow-x: auto }
.table{ width: 100%; border-collapse: collapse; font-size: .93em }
.table th{ text-align: left; font-weight: 550; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap }
.table td{ padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle }
.table tr:last-child td{ border-bottom: 0 }
.table tbody tr{ transition: background .12s }
.table tbody tr.click{ cursor: pointer } .table tbody tr.click:hover{ background: var(--surface-2) }
.table .r{ text-align: right }
:root[data-variant="harbor"] .table th{ text-transform: none; letter-spacing: 0; font-size: 13px }
:root[data-variant="graphite"] .table td{ padding: 8px 14px } :root[data-variant="graphite"] .table th{ padding: 8px 14px }

.meter{ height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border) }
.meter > i{ display: block; height: 100%; border-radius: inherit; background: var(--accent) }
.meter.warn > i{ background: var(--warn) }

.kbd{ font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted) }
.code{ position: relative; background: var(--sunken); border: 1px solid var(--border); border-radius: min(var(--rc), 14px); overflow: hidden }
.code pre{ margin: 0; padding: 16px 18px; overflow-x: auto; font: 13px/1.65 var(--font-mono); color: var(--text) }
.code .copy{ position: absolute; top: 8px; right: 8px }
.tok-t{ color: var(--accent) } .tok-a{ color: var(--info) } .tok-s{ color: var(--ok) } .tok-c{ color: var(--subtle) }

.secret{ display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 12px; border: 1px solid var(--border); border-radius: min(var(--r), 12px); background: var(--sunken); min-width: 0 }
.secret code{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px var(--font-mono) }

.empty{ display: grid; justify-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--muted) }
.empty .ic{ width: 28px; height: 28px; color: var(--subtle) } .empty h3{ color: var(--text); font-size: 1em }

.alert{ display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: min(var(--rc), 14px); background: var(--info-soft); color: var(--text) }
.alert .ic{ color: var(--info); margin-top: 2px } .alert.ok{ background: var(--ok-soft) } .alert.ok .ic{ color: var(--ok) }
.alert.warn{ background: var(--warn-soft) } .alert.warn .ic{ color: var(--warn) }

.avatar{ width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none }

.chips{ display: flex; flex-wrap: wrap; gap: 6px }
.chip{ display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--text) }
.chip:hover{ border-color: var(--accent); color: var(--accent) }
.swatches{ display: flex; gap: 8px }
.swatch{ width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer }
.swatch[aria-checked="true"]{ box-shadow: 0 0 0 2px var(--text) }

/* Dialog, drawer, toast, palette */
dialog{ border: 0; padding: 0; color: var(--text); background: var(--surface); border-radius: calc(var(--rc) + 2px); box-shadow: var(--pop-shadow); width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop{ background: var(--scrim); backdrop-filter: blur(2px) }
dialog[open]{ animation: pop .16s ease-out }
@keyframes pop{ from{ opacity: 0; transform: translateY(6px) scale(.98) } }
.dlg-h{ display: flex; gap: 12px; align-items: flex-start; padding: 20px 20px 0 }
.dlg-h h2{ font-size: 1.1em } .dlg-b{ padding: 14px 20px 20px; display: grid; gap: 14px }
.dlg-f{ display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--sunken) }
dialog.drawer{ margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(460px, 100vw); border-radius: 0; animation: slide .2s ease-out }
@keyframes slide{ from{ transform: translateX(24px); opacity: 0 } }
dialog.palette{ margin-top: 12vh; width: min(560px, calc(100vw - 32px)) }
.pal-in{ display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border) }
.pal-in input{ flex: 1; border: 0; background: none; outline: none; font-size: 1.05em }
.pal-list{ list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow: auto }
.pal-list li{ display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--muted) }
.pal-list li[aria-selected="true"]{ background: var(--accent-soft); color: var(--text) }
.pal-list li small{ margin-left: auto; color: var(--subtle) }
#toasts{ position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)) }
.toast{ display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: min(var(--rc), 14px); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--pop-shadow); animation: pop .18s ease-out }
.toast .ic{ color: var(--ok) } .toast.bad .ic{ color: var(--bad) } .toast.info .ic{ color: var(--info) }
.toast p{ flex: 1 } .toast .btn{ height: 28px }

/* Chat */
.chat{ display: flex; flex-direction: column; height: 520px; max-height: 70vh }
.chat-head{ display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border) }
.chat-logo{ width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: oklch(.99 0 0); background: var(--brand, var(--accent)) }
.chat-log{ flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.msg{ max-width: 82%; padding: 9px 13px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap }
.msg.bot{ align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px }
.msg.me{ align-self: flex-end; background: var(--brand, var(--accent)); color: oklch(.99 0 0); border-bottom-right-radius: 4px }
.msg.err{ background: var(--bad-soft); color: var(--text) }
.typing::after{ content: "▍"; animation: blink 1s steps(1) infinite; color: var(--subtle) }
@keyframes blink{ 50%{ opacity: 0 } }
.chat-compose{ display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border) }
.chat-compose .input{ flex: 1 }

/* Charts */
.spark{ display: block; width: 100%; height: 36px; overflow: visible }
.spark path.l{ fill: none; stroke: var(--accent); stroke-width: 1.8; vector-effect: non-scaling-stroke }

const badge = (tone, text, dot) => `<span class="badge ${tone}">${dot ? `<span class="dot ${dot === 'pulse' ? 'pulse' : ''}"></span>` : ''}${text}</span>`;
const pstatus = p => ({ ok: badge('ok', 'Healthy', 1), slow: badge('warn', 'Slow', 1), cooldown: badge('bad', 'Cooling down', 'pulse'), off: badge('', 'Off', 1) })[p.status];
const fmt = n => n.toLocaleString('en-GB');
function spark(vals, h = 36){
  const w = 100, max = Math.max(...vals), min = Math.min(...vals), sx = w / (vals.length - 1);
  const y = v => h - 3 - ((v - min) / ((max - min) || 1)) * (h - 6);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${(i * sx).toFixed(2)} ${y(v).toFixed(2)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d} L${w} ${h} L0 ${h}Z"/><path class="l" d="${d}"/></svg>`;
}
function barChart(vals, labels){
  const W = 640, H = 210, pl = 34, pb = 26, pt = 10, cw = W - pl - 8, ch = H - pb - pt;
  const max = 300, ticks = [0, 100, 200, 300], bw = cw / vals.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions per day for the last 14 days, rising from 148 to 262" style="width:100%;height:auto">`;
  ticks.forEach(t => { const y = pt + ch - (t / max) * ch; s += `<line class="grid" x1="${pl}" x2="${W - 8}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${t}</text>`; });
  vals.forEach((v, i) => { const h = (v / max) * ch, x = pl + i * bw + bw * .18; s += `<rect class="bar ${i < vals.length - 7 ? 'dim' : ''}" x="${x}" y="${pt + ch - h}" width="${bw * .64}" height="${h}" rx="3"><title>${labels[i]}: ${v}</title></rect>`; if (i % 2 === 1 || i === vals.length - 1) s += `<text x="${x + bw * .32}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`; });
  return s + '</svg>';
}
function areaChart(vals){
  const W = 720, H = 220, pl = 36, pb = 24, pt = 12, cw = W - pl - 12, ch = H - pb - pt, max = 350;
  const x = i => pl + (i / (vals.length - 1)) * cw, y = v => pt + ch - (v / max) * ch;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions per day over 30 days, rising from 120 to 312" style="width:100%;height:auto">`;
  [0, 100, 200, 300].forEach(t => s += `<line class="grid" x1="${pl}" x2="${W - 12}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`);
  [0, 9, 19, 29].forEach(i => s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}">${['23 Oct','1 Nov','11 Nov','21 Nov'][[0,9,19,29].indexOf(i)]}</text>`);
  s += `<path class="area" d="${d} L${x(vals.length - 1)} ${y(0)} L${x(0)} ${y(0)}Z"/><path class="line" d="${d}"/>`;
  s += `<circle class="end" cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="5"/>`;
  return s + '</svg>';
}

function custTable(rows){
  if (!rows.length) return `<div class="empty">${ic('search')}<h3>No customers match "${esc(UI.custQuery)}"</h3><p>Try a different name or email.</p></div>`;
  return `<div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Plan</th><th style="min-width:160px">Usage</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>
  ${rows.map(c => { const pct = c.used / c.limit * 100; return `<tr><td><div class="row"><span class="avatar">${c.name.split(' ').map(w => w[0]).slice(0, 2).join('')}</span><div style="min-width:0"><div style="font-weight:550">${esc(c.name)}</div><div class="subtle" style="font-size:12.5px">${esc(c.email)}</div></div></div></td>
    <td>${c.plan === 'Pro' ? badge('acc', 'Pro') : badge('', 'Free')}</td>
    <td><div class="stack-sm" style="gap:4px"><span class="num subtle" style="font-size:12.5px">${fmt(c.used)} / ${fmt(c.limit)}</span><div class="meter ${pct > 85 ? 'warn' : ''}" role="meter" aria-valuenow="${c.used}" aria-valuemin="0" aria-valuemax="${c.limit}" aria-label="Usage for ${esc(c.name)}"><i style="width:${pct}%"></i></div></div></td>
    <td>${c.status === 'active' ? badge('ok', 'Active', 1) : badge('warn', 'Paused', 1)}</td>
    <td class="r"><div class="row" style="justify-content:flex-end;gap:2px"><button class="btn ghost icon sm" aria-label="${c.status === 'active' ? 'Pause' : 'Resume'} ${esc(c.name)}" data-act="cust-pause" data-id="${c.id}">${ic(c.status === 'active' ? 'pause' : 'play')}</button><button class="btn ghost icon sm" aria-label="New API key for ${esc(c.name)}" data-act="rotate" data-id="${c.id}">${ic('key')}</button><button class="btn ghost icon sm" aria-label="View requests from ${esc(c.name)}" data-go="logs">${ic('list')}</button></div></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- Render ---------- */
function applyTheme(){
  const r = document.documentElement, a = V[S.v].accents[S.acc[S.v]];
  r.dataset.variant = S.v; r.style.setProperty('--ah', a.h); r.style.setProperty('--ac', a.c);
  r.style.setProperty('--al', a.l || .52); r.style.setProperty('--ad', a.d || .76);
  if (S.theme === 'auto') delete r.dataset.theme; else r.dataset.theme = S.theme;
}
function render(focusMain){
  if (!NAV[S.con].some(n => n.id === S.view)) S.view = NAV[S.con][0].id;
  applyTheme();
  const body = S.view === 'home' ? HOME[S.v]() : VIEWS[S.view]();
  $('#app').innerHTML = SHELL[S.v](body);
  renderSwitcher();
  if (focusMain) $('#main').focus({ preventScroll: true });
  const log = $('#chat-log'); if (log) log.scrollTop = log.scrollHeight;
  try { history.replaceState(null, '', '#' + S.v); } catch {}
  store.set('state', S);
}
function renderSwitcher(){
  const v = V[S.v], i = ORDER.indexOf(S.v);
  $('#sw-title').textContent = v.name;
  $('#sw-sub').textContent = `${i + 1} of 4 · ${v.tag}`;
  $('#sw-accents').innerHTML = v.accents.map((a, j) => `<button class="acc" role="radio" aria-checked="${S.acc[S.v] === j}" aria-label="${a.name} accent" title="${a.name}" data-acc="${j}"><i style="background:oklch(${a.d || .74} ${a.c} ${a.h})"></i></button>`).join('');
  const th = { auto:['auto','Auto'], light:['sun','Light'], dark:['moon','Dark'] }[S.theme];
  $('#sw-theme-ic').setAttribute('d', I[th[0]]); $('#sw-theme-l').textContent = th[1];
  $('#sw-theme').setAttribute('aria-label', `Theme: ${th[1]}. Click to change.`);
}
function cycle(d){ const i = ORDER.indexOf(S.v); S.v = ORDER[(i + d + ORDER.length) % ORDER.length]; render(); }

/* ---------- Feedback ---------- */
function toast(msg, tone = 'ok', action){
  const el = document.createElement('div'); el.className = 'toast ' + tone;
  el.innerHTML = `${ic(tone === 'bad' ? 'alert' : tone === 'info' ? 'info' : 'check')}<p>${esc(msg)}</p>${action ? `<button class="btn ghost sm">${action.label}</button>` : ''}<button class="btn ghost icon sm" aria-label="Dismiss">${ic('x')}</button>`;
  const kill = () => el.remove();
  const btns = el.querySelectorAll('button'); btns[btns.length - 1].onclick = kill;
  if (action) btns[0].onclick = () => { action.run(); kill(); };
  $('#toasts').prepend(el); setTimeout(kill, action ? 6000 : 3200);
}
function loading(btn, ms, done){
  const html = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${btn.textContent.trim() || ''}`;
  setTimeout(() => { if (btn.isConnected){ btn.disabled = false; btn.removeAttribute('aria-busy'); btn.innerHTML = html; } done(); }, ms);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  catch { toast('Copy is blocked here. Select the text and press Ctrl C.', 'bad'); }
}
const dlg = $('#dlg');
function openDialog(html, cls = ''){ dlg.className = cls; dlg.innerHTML = html; dlg.showModal(); const f = dlg.querySelector('[autofocus], input, button.pri, button'); f && f.focus(); }
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function confirmDialog({ title, body, ok, tone = 'pri', run }){
  openDialog(`<div class="dlg-h">${tone === 'danger' ? `<span class="badge bad" style="height:32px;width:32px;justify-content:center;padding:0">${ic('alert')}</span>` : ''}<div><h2 id="dlg-title">${title}</h2><p class="muted" style="margin-top:4px">${body}</p></div></div>
    <div class="dlg-f" style="margin-top:18px"><button class="btn ghost" data-close>Cancel</button><button class="btn ${tone}" data-ok>${ok}</button></div>`);
  dlg.querySelector('[data-close]').onclick = () => dlg.close();
  dlg.querySelector('[data-ok]').onclick = e => loading(e.currentTarget, 700, () => { dlg.close(); run(); });
}
function addKnowledgeDialog(mode = 'file'){
  const panes = {
    file: `<div class="field"><span class="label">File</span><label class="card card-b" style="border-style:dashed;display:grid;justify-items:center;gap:6px;cursor:pointer;text-align:center">${ic('upload', 'lg')}<span><b>Choose a file</b> or drag it here</span><span class="hint">PDF, Word, Markdown or text, up to 5 MB</span><input type="file" class="sr" id="k-file"></label></div>`,
    web: `<div class="field"><label for="k-url">Web page address</label><input class="input" id="k-url" placeholder="https://brightpath.example/pricing" aria-describedby="k-url-h"><span class="hint" id="k-url-h">We read the page and keep it in sync once a week.</span></div>`,
    text: `<div class="field"><label for="k-title">Title</label><input class="input" id="k-title" value="Paying in instalments"></div><div class="field"><label for="k-text">Text</label><textarea class="textarea" id="k-text">You can split a 10-lesson bundle into 3 monthly payments of £114 at no extra cost.</textarea></div>`,
  };
  openDialog(`<div class="dlg-h"><div><h2 id="dlg-title">Add knowledge</h2><p class="muted">Give your chatbot something new to answer from.</p></div><span class="spacer"></span><button class="btn ghost icon sm" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="dlg-b"><div class="seg" role="radiogroup" aria-label="Source">${[['file','File','file'],['web','Web page','globe'],['text','Text','text']].map(m => `<button role="radio" aria-checked="${mode === m[0]}" data-mode="${m[0]}">${ic(m[2])}${m[1]}</button>`).join('')}</div>${panes[mode]}</div>
    <div class="dlg-f"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" data-ok>Add to knowledge</button></div>`);
  $$('[data-close]', dlg).forEach(b => b.onclick = () => dlg.close());
  $$('[data-mode]', dlg).forEach(b => b.onclick = () => addKnowledgeDialog(b.dataset.mode));
  dlg.querySelector('[data-ok]').onclick = e => {
    if (mode === 'web'){ const u = $('#k-url'); if (!/^https?:\/\/[^\s.]+\.[^\s]+$/.test(u.value.trim())){ u.setAttribute('aria-invalid', 'true'); $('#k-url-h').outerHTML = `<span class="err" id="k-url-h">${ic('alert')}Enter a full address starting with https://</span>`; u.focus(); return; } }
    loading(e.currentTarget, 900, () => {
      const title = mode === 'text' ? ($('#k-title') || {}).value || 'New text' : mode === 'web' ? $('#k-url').value.replace(/^https?:\/\//, '') : 'Uploaded file.pdf';
      DOCS.unshift({ id:'d' + Date.now(), title, src: { file:'File', web:'Website', text:'Text' }[mode], size: mode === 'text' ? '1 KB' : '—', when:'Just now', state:'indexing' });
      dlg.close(); S.con = 'app'; S.view = 'knowledge'; render(); toast(`Added "${title}". Your chatbot can use it in a few seconds.`);
      setTimeout(() => { const d = DOCS[0]; if (d && d.state === 'indexing'){ d.state = 'ready'; d.size = d.size === '—' ? '18 KB' : d.size; if (S.view === 'knowledge') render(); } }, 2600);
    });
  };
}
function logDrawer(l){
  const json = JSON.stringify({ id:'req_7f2' + l.t.replace(/:/g, ''), customer:l.cust, provider:l.prov, model:l.model, status:l.status, latency_ms:l.ms, tokens:{ prompt: Math.round(l.tok * .7), completion: l.tok - Math.round(l.tok * .7) }, cache:false, attempts: l.status >= 400 ? 1 : 1 }, null, 2);
  openDialog(`<div class="dlg-h"><div><h2 id="dlg-title">Request at ${l.t}</h2><p class="muted">${l.cust}</p></div><span class="spacer"></span><button class="btn ghost icon sm" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="dlg-b"><div class="kpis" style="grid-template-columns:repeat(2,1fr)">${[['Status', l.status < 400 ? badge('ok', l.status + ' OK') : badge('bad', l.status + ' failed')],['Latency', fmt(l.ms) + ' ms'],['Provider', l.prov],['Tokens', l.tok ? fmt(l.tok) : '—']].map(k => `<div class="card kpi"><span class="kpi-l">${k[0]}</span><span style="font-weight:600">${k[1]}</span></div>`).join('')}</div>
    ${l.status >= 400 ? `<div class="alert warn">${ic('alert')}<div>${l.prov} returned ${l.status}. The request moved to the next provider automatically.</div></div>` : ''}
    <div class="code"><pre>${esc(json)}</pre><button class="btn sec sm copy" data-copyjson>${ic('copy')}Copy</button></div></div>`, 'drawer');
  $$('[data-close]', dlg).forEach(b => b.onclick = () => dlg.close());
  dlg.querySelector('[data-copyjson]').onclick = () => copy(json);
}
function mobileNav(){
  openDialog(`<div class="dlg-h"><div>${brand()}</div><span class="spacer"></span><button class="btn ghost icon sm" data-close aria-label="Close menu">${ic('x')}</button></div><div class="dlg-b">${conSeg()}<nav class="nav-g" aria-label="Sections">${navItems('nav-i')}</nav></div>`, 'drawer');
  $$('[data-close]', dlg).forEach(b => b.onclick = () => dlg.close());
}
function palette(){
  const items = [...NAV.app.map(n => ({ ...n, con:'app', grp:'Customer' })), ...NAV.admin.map(n => ({ ...n, con:'admin', grp:'Admin' })),
    { id:'act-add', label:'Add knowledge', icon:'plus', grp:'Action', run: () => addKnowledgeDialog() },
    { id:'act-theme', label:'Switch light / dark', icon:'moon', grp:'Action', run: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); } },
    ...ORDER.map(k => ({ id:'dir-' + k, label:`Direction: ${V[k].name}`, icon:'sparkles', grp:'Prototype', run: () => { S.v = k; render(); } }))];
  let sel = 0, list = items;
  openDialog(`<div class="pal-in">${ic('search')}<label class="sr" for="pal-q">Search</label><input id="pal-q" placeholder="Jump to a page or run an action…" autocomplete="off" role="combobox" aria-controls="pal-l" aria-expanded="true"><span class="kbd">Esc</span></div><ul class="pal-list" id="pal-l" role="listbox"></ul>`, 'palette');
  const q = $('#pal-q'), ul = $('#pal-l');
  const draw = () => { ul.innerHTML = list.map((it, i) => `<li role="option" id="pal-${i}" aria-selected="${i === sel}" data-i="${i}">${ic(it.icon)}<span>${it.label}</span><small>${it.grp}</small></li>`).join('') || `<li aria-disabled="true">No matches</li>`; q.setAttribute('aria-activedescendant', 'pal-' + sel); };
  const go = it => { dlg.close(); if (!it) return; if (it.run) it.run(); else { S.con = it.con; S.view = it.id; render(true); } };
  q.oninput = () => { const t = q.value.toLowerCase(); list = items.filter(it => it.label.toLowerCase().includes(t) || it.grp.toLowerCase().includes(t)); sel = 0; draw(); };
  q.onkeydown = e => { if (e.key === 'ArrowDown'){ sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp'){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } else if (e.key === 'Enter'){ go(list[sel]); e.preventDefault(); } };
  ul.onclick = e => { const li = e.target.closest('li[data-i]'); li && go(list[+li.dataset.i]); };
  draw(); q.focus();
}

/* ---------- Chat simulation ---------- */
function sendChat(text){
  if (!text.trim() || UI.streaming) return;
  UI.chat.push({ who:'me', text }); UI.chat.push({ who:'bot', text:'' }); UI.streaming = true; render();
  const t = text.toLowerCase();
  const reply = /refund|cancel/.test(t) ? ANSWERS.refund : /price|cost|bundle|how much/.test(t) ? ANSWERS.price : /instal/.test(t) ? null : ANSWERS.default;
  const log = $('#chat-log'), bubble = log.lastElementChild; bubble.classList.add('typing');
  if (!reply){ setTimeout(() => { const m = UI.chat[UI.chat.length - 1]; m.text = "I don't have that in my knowledge yet, so I've passed your question to the team. They'll reply by email."; m.err = false; UI.streaming = false; render(); toast('Sent to you: "Can I pay in instalments?"', 'info'); }, 900); return; }
  const words = reply.split(' '); let i = 0;
  const tick = setInterval(() => {
    const m = UI.chat[UI.chat.length - 1]; m.text += (i ? ' ' : '') + words[i++];
    const b = $('#chat-log') && $('#chat-log').lastElementChild; if (b){ b.textContent = m.text; b.classList.add('typing'); b.parentElement.scrollTop = 1e6; }
    if (i >= words.length){ clearInterval(tick); UI.streaming = false; if (S.view === 'chatbot') render(); }
  }, 38);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-con],[data-act],[data-acc]'); if (!t) return;
  if (t.closest('#switcher') && t.dataset.acc !== undefined){ S.acc[S.v] = +t.dataset.acc; render(); return; }
  if (t.dataset.go){ if (dlg.open) dlg.close(); S.view = t.dataset.go; if (!NAV[S.con].some(n => n.id === S.view)) S.con = S.con === 'app' ? 'admin' : 'app'; render(true); window.scrollTo(0, 0); return; }
  if (t.dataset.con){ if (dlg.open) dlg.close(); if (S.con !== t.dataset.con){ S.con = t.dataset.con; S.view = NAV[S.con][0].id; render(true); } return; }
  const a = t.dataset.act;
  ({
    palette, mnav: mobileNav, 'add-knowledge': () => addKnowledgeDialog(),
    copy: () => copy(t.dataset.copy),
    'toggle-key': () => { UI.keyShown = !UI.keyShown; render(); },
    toast: () => toast(t.dataset.msg, t.dataset.tone || 'ok'),
    resync: () => loading(t, 1100, () => { const d = DOCS.find(x => x.state === 'stale'); if (d){ d.state = 'ready'; d.when = 'Just now'; } if (S.view === 'knowledge') render(); toast('Website re-synced. 3 pages updated.'); }),
    'del-doc': () => { const d = DOCS.find(x => x.id === t.dataset.id); confirmDialog({ title:`Delete "${esc(d.title)}"?`, body:'Your chatbot will stop using it straight away.', ok:'Delete', tone:'danger', run: () => { const idx = DOCS.indexOf(d); DOCS.splice(idx, 1); render(); toast(`Deleted "${d.title}"`, 'ok', { label:'Undo', run: () => { DOCS.splice(idx, 0, d); render(); } }); } }); },
    brand: () => { UI.bot.brand = +t.dataset.i; render(); },
    badge: () => { UI.bot.badge = !UI.bot.badge; t.setAttribute('aria-checked', UI.bot.badge); },
    ask: () => sendChat(t.dataset.q === 'Prices' ? 'How much does it cost?' : t.dataset.q === 'Cancellation policy' ? 'What is your cancellation and refund policy?' : t.dataset.q === 'Book a trial' ? 'Can I book a trial lesson?' : 'Do you offer weekend sessions?'),
    'reset-chat': () => { UI.chat = [{ who:'bot', text: UI.bot.greeting }]; render(); },
    'install-tab': () => { UI.installTab = t.dataset.t; render(); $('#tab-' + UI.installTab).focus(); },
    verify: () => loading(t, 1400, () => { $('#verify-out').innerHTML = `<div class="alert ok">${ic('check')}<div><b>Found it.</b> The chatbot is live on brightpath.example and answered a test question in 0.8 s.</div></div>`; }),
    'usage-filter': () => { UI.usageFilter = t.dataset.f; render(); },
    'log-filter': () => { UI.logFilter = t.dataset.f; render(); },
    log: () => logDrawer(LOGS[+t.dataset.i]),
    'cancel-plan': () => confirmDialog({ title:'Cancel Pro?', body:'You keep Pro until 1 December. After that your chatbot moves to Free: 500 questions a month and the ZeroRoute badge.', ok:'Cancel Pro', tone:'danger', run: () => toast('Pro cancelled. It stays active until 1 December.') }),
    'test-all': () => loading(t, 1600, () => toast('6 of 7 providers answered. GitHub Models is cooling down until 21:47.', 'info')),
    move: () => { const i = +t.dataset.i, j = i + +t.dataset.d; [PROVIDERS[i], PROVIDERS[j]] = [PROVIDERS[j], PROVIDERS[i]]; render(); const b = $(`[data-act="move"][data-i="${j}"][data-d="${t.dataset.d}"]`) || $(`[data-act="move"][data-i="${j}"]`); b && b.focus(); toast(`${PROVIDERS[j].name} moved to position ${j + 1}`); },
    'prov-toggle': () => { const p = PROVIDERS[+t.dataset.i]; p.on = !p.on; p.status = p.on ? 'ok' : 'off'; p.lat = p.on ? 300 : 0; render(); toast(`${p.name} ${p.on ? 'turned on' : 'turned off'}`); },
    'cust-pause': () => { const c = CUSTOMERS.find(x => x.id === t.dataset.id); c.status = c.status === 'active' ? 'paused' : 'active'; render(); toast(`${c.name} ${c.status === 'paused' ? 'paused. Their chatbot stops answering.' : 'resumed'}`, c.status === 'paused' ? 'info' : 'ok'); },
    rotate: () => { const c = CUSTOMERS.find(x => x.id === t.dataset.id); confirmDialog({ title:`Create a new API key for ${esc(c.name)}?`, body:'The current key stops working immediately. Any server using it will fail until it is updated.', ok:'Create new key', tone:'danger', run: () => toast(`New key created for ${c.name}. Send it to them securely.`) }); },
  }[a] || (() => {}))();
});
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input, textarea, select, [contenteditable]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); palette(); return; }
  if (!typing && !dlg.open && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest('[role="tablist"]')){ cycle(e.key === 'ArrowLeft' ? -1 : 1); }
  if (e.target.matches('tr.click') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.target.click(); }
  if (e.target.matches('[role="tab"]') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ const tabs = $$('[role="tab"]'), i = tabs.indexOf(e.target); tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length].click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cust-q'){ UI.custQuery = e.target.value; const q = UI.custQuery.toLowerCase(); $('#cust-body').innerHTML = custTable(CUSTOMERS.filter(c => !q || (c.name + c.email).toLowerCase().includes(q))); }
  if (e.target.id === 'f-name'){ UI.bot.name = e.target.value; const n = $('#chat-name'); if (n) n.textContent = e.target.value || 'Your chatbot'; }
  if (e.target.id === 'f-greet'){ UI.bot.greeting = e.target.value; if (UI.chat.length === 1){ UI.chat[0].text = e.target.value; const b = $('#chat-log .msg'); if (b) b.textContent = e.target.value; } }
  if (e.target.id === 'f-instr') UI.bot.instructions = e.target.value;
  if (e.target.id === 'f-domain'){ const v = e.target.value.trim(), bad = v && !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(v); e.target.setAttribute('aria-invalid', bad); $('#f-domain-m').outerHTML = bad ? `<span class="err" id="f-domain-m">${ic('alert')}That doesn't look like a domain. Use something like www.example.com</span>` : `<span class="hint" id="f-domain-m">${v ? 'Looks good. It will be added when you save.' : 'The chatbot only works on these sites.'}</span>`; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'chat-form'){ const i = $('#chat-in'); const v = i.value; i.value = ''; sendChat(v); }
  if (e.target.id === 'bot-form'){ const d = $('#f-domain'); if (d.getAttribute('aria-invalid') === 'true'){ d.focus(); toast('Fix the highlighted field first', 'bad'); return; } loading($('#save-bot'), 900, () => toast('Chatbot settings saved')); }
});
$('#sw-prev').onclick = () => cycle(-1);
$('#sw-next').onclick = () => cycle(1);
$('#sw-theme').onclick = () => { S.theme = { auto:'light', light:'dark', dark:'auto' }[S.theme]; render(); };
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (V[k] && k !== S.v){ S.v = k; render(); } });
render();
</script>
