name: CI

on:
  pull_request:
  push:
    branches: [main, "ci/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Report-only until the existing lint errors are fixed (#29); then drop continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true
